name: CI Pipeline

on:
  push:
    branches:
      - devel
      - 'feature/**'
      - 'bugfix/**'
  pull_request:
    branches:
      - devel

defaults:
  run:
    working-directory: codebase/rdicidr-0.1.0

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Compute cache key
        id: cachekey
        run: echo "key=node-modules-${{ hashFiles('codebase/rdicidr-0.1.0/package.json') }}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '15'

      - name: Install dependencies
        run: npm install

      - name: Cache node_modules
        uses: actions/cache/save@v3
        with:
          path: codebase/rdicidr-0.1.0/node_modules
          key: ${{ steps.cachekey.outputs.key }}

  lint:
    needs: [install]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Compute cache key
        id: cachekey
        run: echo "key=node-modules-${{ hashFiles('codebase/rdicidr-0.1.0/package.json') }}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '15'

      - name: Restore node_modules
        uses: actions/cache/restore@v3
        with:
          path: codebase/rdicidr-0.1.0/node_modules
          key: ${{ steps.cachekey.outputs.key }}

      - name: Run linter
        run: npm run lint

      - name: Run formatter
        run: npm run prettier

  test:
    needs: [install]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Compute cache key
        id: cachekey
        run: echo "key=node-modules-${{ hashFiles('codebase/rdicidr-0.1.0/package.json') }}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '15'

      - name: Restore node_modules
        uses: actions/cache/restore@v3
        with:
          path: codebase/rdicidr-0.1.0/node_modules
          key: ${{ steps.cachekey.outputs.key }}

      - name: Run tests
        env:
          CI: true
          REACT_APP_API_URL: https://api.example.com
        run: npm run test

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Compute cache key
        id: cachekey
        run: echo "key=node-modules-${{ hashFiles('codebase/rdicidr-0.1.0/package.json') }}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '15'

      - name: Restore node_modules
        uses: actions/cache/restore@v3
        with:
          path: codebase/rdicidr-0.1.0/node_modules
          key: ${{ steps.cachekey.outputs.key }}

      - name: Build project
        env:
          REACT_APP_API_URL: https://api.example.com
        run: npm run build
